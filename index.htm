<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Ledger & Bank Tracker</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --in-color: #27ae60;
            --out-color: #e74c3c;
            --bg: #f4f7f6;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); padding: 15px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        
        /* Navigation Tabs */
        .nav-tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: bold; font-size: 16px; background: none; border: none; cursor: pointer; color: #777; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .view-panel { display: none; }
        .view-panel.active { display: block; }

        /* Card Component */
        .card { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-title { font-size: 18px; font-weight: bold; color: var(--primary); }
        .card-balance { font-size: 15px; font-weight: bold; }

        /* Actions Bar */
        .action-btns { display: flex; gap: 6px; }
        .btn-sm { padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .btn-edit { background: #f39c12; color: white; }
        .btn-del { background: #e74c3c; color: white; }

        /* Forms & Inputs */
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; font-weight: 600; color: #555; }
        input, select { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 10px 15px; font-size: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-in { background: var(--in-color); color: white; flex: 1; }
        .btn-out { background: var(--out-color); color: white; flex: 1; }
        .btn-primary { background: var(--accent); color: white; width: 100%; }

        /* History Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #eee; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .txt-in { color: var(--in-color); font-weight: bold; }
        .txt-out { color: var(--out-color); font-weight: bold; }
        
        .add-box { background: #eef6fb; border: 1px dashed var(--accent); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .empty-msg { font-size: 14px; color: #888; text-align: center; padding: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- Navigation Switcher -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('accounts')">🏦 Accounts View</button>
        <button class="tab-btn" onclick="switchTab('persons')">👤 Persons / Heads View</button>
    </div>

    <!-- ================= ACCOUNTS VIEW ================= -->
    <div id="accountsView" class="view-panel active">
        <div class="add-box">
            <h4 style="margin-bottom:10px;">Add New Bank Account</h4>
            <div class="form-group">
                <input type="text" id="newBankName" placeholder="Bank Name (e.g., Bank of Baroda)">
            </div>
            <div class="form-group">
                <input type="number" id="newBankBalance" placeholder="Opening Balance (₹)">
            </div>
            <button class="btn-primary" onclick="addBank()">Add Bank Account</button>
        </div>

        <h3>Bank Accounts List</h3>
        <div id="banksList"></div>
    </div>

    <!-- ================= PERSONS VIEW ================= -->
    <div id="personsView" class="view-panel">
        <div class="add-box">
            <h4 style="margin-bottom:10px;">Add New Person / Head</h4>
            <div class="form-group">
                <input type="text" id="newPersonName" placeholder="Person / Head Name (e.g., Ashutosh)">
            </div>
            <button class="btn-primary" onclick="addPerson()">Add Person</button>
        </div>

        <h3>Persons / Heads List</h3>
        <div id="personsList"></div>
    </div>
</div>

<script>
    let state = JSON.parse(localStorage.getItem('ledgerAppV2')) || {
        banks: [],
        persons: [],
        transactions: []
    };

    function saveData() {
        localStorage.setItem('ledgerAppV2', JSON.stringify(state));
        render();
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
        
        if(tab === 'accounts') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('accountsView').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('personsView').classList.add('active');
        }
    }

    // Add Bank
    function addBank() {
        const name = document.getElementById('newBankName').value.trim();
        const balance = parseFloat(document.getElementById('newBankBalance').value) || 0;
        if(!name) return alert('Please enter Bank Name');
        
        state.banks.push({ id: 'b_' + Date.now(), name, balance });
        document.getElementById('newBankName').value = '';
        document.getElementById('newBankBalance').value = '';
        saveData();
    }

    // Edit Bank Name or Balance
    function editBank(bankId) {
        const bank = state.banks.find(b => b.id === bankId);
        if(!bank) return;

        const newName = prompt("Update Bank Name:", bank.name);
        if(newName === null) return;

        const newBalance = prompt("Update Current Balance (₹):", bank.balance);
        if(newBalance === null || isNaN(parseFloat(newBalance))) return;

        bank.name = newName.trim() || bank.name;
        bank.balance = parseFloat(newBalance);
        
        // Update names in transaction history
        state.transactions.forEach(t => {
            if(t.bankId === bankId) t.bankName = bank.name;
        });

        saveData();
    }

    // Delete Bank
    function deleteBank(bankId) {
        if(!confirm("Are you sure you want to delete this Bank Account?")) return;
        state.banks = state.banks.filter(b => b.id !== bankId);
        state.transactions = state.transactions.filter(t => t.bankId !== bankId);
        saveData();
    }

    // Add Person
    function addPerson() {
        const name = document.getElementById('newPersonName').value.trim();
        if(!name) return alert('Please enter Person Name');
        
        state.persons.push({ id: 'p_' + Date.now(), name });
        document.getElementById('newPersonName').value = '';
        saveData();
    }

    // Edit Person
    function editPerson(personId) {
        const person = state.persons.find(p => p.id === personId);
        if(!person) return;

        const newName = prompt("Update Person Name:", person.name);
        if(!newName || !newName.trim()) return;

        person.name = newName.trim();
        
        // Update names in transaction history
        state.transactions.forEach(t => {
            if(t.personId === personId) t.personName = person.name;
        });

        saveData();
    }

    // Delete Person
    function deletePerson(personId) {
        if(!confirm("Are you sure you want to delete this Person?")) return;
        state.persons = state.persons.filter(p => p.id !== personId);
        state.transactions = state.transactions.filter(t => t.personId !== personId);
        saveData();
    }

    // Submit Transaction
    function submitTransaction(bankId, personId, type, amountId) {
        const amount = parseFloat(document.getElementById(amountId).value);
        if(!amount || amount <= 0) return alert('Please enter a valid amount');

        const bank = state.banks.find(b => b.id === bankId);
        const person = state.persons.find(p => p.id === personId);

        if(!bank || !person) return alert('Please select both Bank and Person');

        if(type === 'IN') {
            bank.balance += amount;
        } else {
            bank.balance -= amount;
        }

        state.transactions.unshift({
            id: 't_' + Date.now(),
            bankId: bank.id,
            bankName: bank.name,
            personId: person.id,
            personName: person.name,
            type,
            amount,
            date: new Date().toLocaleDateString('en-IN')
        });

        saveData();
    }

    // Delete / Undo Transaction
    function deleteTransaction(transId) {
        if(!confirm("Delete this transaction? Bank balance will be adjusted automatically.")) return;

        const transIndex = state.transactions.findIndex(t => t.id === transId);
        if(transIndex === -1) return;

        const t = state.transactions[transIndex];
        const bank = state.banks.find(b => b.id === t.bankId);

        // Reverse Bank Effect
        if(bank) {
            if(t.type === 'IN') {
                bank.balance -= t.amount;
            } else {
                bank.balance += t.amount;
            }
        }

        state.transactions.splice(transIndex, 1);
        saveData();
    }

    // Render UI
    function render() {
        // --- Render Accounts View ---
        const banksList = document.getElementById('banksList');
        banksList.innerHTML = '';

        if (state.banks.length === 0) {
            banksList.innerHTML = '<p class="empty-msg">No bank accounts added yet.</p>';
        } else {
            state.banks.forEach(bank => {
                const personOptions = state.persons.length > 0 
                    ? state.persons.map(p => `<option value="${p.id}">${p.name}</option>`).join('')
                    : '<option value="">No Persons Added</option>';
                
                const bankTrans = state.transactions.filter(t => t.bankId === bank.id);

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <span class="card-title">🏦 ${bank.name}</span>
                            <div class="action-btns" style="margin-top:4px;">
                                <button class="btn-sm btn-edit" onclick="editBank('${bank.id}')">Edit</button>
                                <button class="btn-sm btn-del" onclick="deleteBank('${bank.id}')">Delete</button>
                            </div>
                        </div>
                        <span class="card-balance">Balance: ₹${bank.balance}</span>
                    </div>
                    <div class="form-group">
                        <label>Select Person/Head:</label>
                        <select id="person_select_${bank.id}">
                            <option value="">-- Select Person --</option>
                            ${personOptions}
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="number" id="amount_bank_${bank.id}" placeholder="Amount (₹)">
                    </div>
                    <div class="btn-group">
                        <button class="btn-in" onclick="handleBankTrans('${bank.id}', 'IN')">+ IN (Received)</button>
                        <button class="btn-out" onclick="handleBankTrans('${bank.id}', 'OUT')">- OUT (Paid)</button>
                    </div>
                    ${renderHistoryTable(bankTrans, 'personName')}
                `;
                banksList.appendChild(card);
            });
        }

        // --- Render Persons View ---
        const personsList = document.getElementById('personsList');
        personsList.innerHTML = '';

        if (state.persons.length === 0) {
            personsList.innerHTML = '<p class="empty-msg">No persons added yet.</p>';
        } else {
            state.persons.forEach(person => {
                const bankOptions = state.banks.length > 0 
                    ? state.banks.map(b => `<option value="${b.id}">${b.name}</option>`).join('')
                    : '<option value="">No Banks Added</option>';
                
                const personTrans = state.transactions.filter(t => t.personId === person.id);

                let personBalance = 0;
                personTrans.forEach(t => {
                    if(t.type === 'OUT') personBalance += t.amount;
                    if(t.type === 'IN') personBalance -= t.amount;
                });

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <span class="card-title">👤 ${person.name}</span>
                            <div class="action-btns" style="margin-top:4px;">
                                <button class="btn-sm btn-edit" onclick="editPerson('${person.id}')">Edit</button>
                                <button class="btn-sm btn-del" onclick="deletePerson('${person.id}')">Delete</button>
                            </div>
                        </div>
                        <span class="card-balance" style="color: ${personBalance >= 0 ? 'var(--in-color)' : 'var(--out-color)'}">
                            ${personBalance >= 0 ? 'To Get: ₹' + personBalance : 'To Pay: ₹' + Math.abs(personBalance)}
                        </span>
                    </div>
                    <div class="form-group">
                        <label>Select Bank Account:</label>
                        <select id="bank_select_${person.id}">
                            <option value="">-- Select Bank --</option>
                            ${bankOptions}
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="number" id="amount_person_${person.id}" placeholder="Amount (₹)">
                    </div>
                    <div class="btn-group">
                        <button class="btn-in" onclick="handlePersonTrans('${person.id}', 'IN')">+ IN (Received)</button>
                        <button class="btn-out" onclick="handlePersonTrans('${person.id}', 'OUT')">- OUT (Paid)</button>
                    </div>
                    ${renderHistoryTable(personTrans, 'bankName')}
                `;
                personsList.appendChild(card);
            });
        }
    }

    function handleBankTrans(bankId, type) {
        const personId = document.getElementById(`person_select_${bankId}`).value;
        submitTransaction(bankId, personId, type, `amount_bank_${bankId}`);
    }

    function handlePersonTrans(personId, type) {
        const bankId = document.getElementById(`bank_select_${personId}`).value;
        submitTransaction(bankId, personId, type, `amount_person_${personId}`);
    }

    function renderHistoryTable(transactions, relatedField) {
        if(transactions.length === 0) return '<p style="font-size:12px; color:#888; margin-top:10px;">No transactions recorded.</p>';
        
        let rows = transactions.map(t => `
            <tr>
                <td>${t[relatedField]}</td>
                <td class="${t.type === 'IN' ? 'txt-in' : 'txt-out'}">${t.type}</td>
                <td>₹${t.amount}</td>
                <td>${t.date}</td>
                <td style="text-align:center;">
                    <button class="btn-sm btn-del" onclick="deleteTransaction('${t.id}')">✕</button>
                </td>
            </tr>
        `).join('');

        return `
            <table>
                <thead>
                    <tr><th>Details</th><th>Type</th><th>Amount</th><th>Date</th><th>Action</th></tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        `;
    }

    // Initial Load
    render();
</script>

</body>
</html>
