<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khata - Personal Ledger & Bank Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --in-color: #10b981;
            --in-bg: #ecfdf5;
            --out-color: #ef4444;
            --out-bg: #fef2f2;
            --accent-blue: #2563eb;
            --primary-gradient: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            --input-bg: #f8fafc;
            --bottom-nav-bg: #ffffff;
            --card-radius: 18px;
        }

        body.dark-mode {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --in-bg: rgba(16, 185, 129, 0.15);
            --out-bg: rgba(239, 68, 68, 0.15);
            --input-bg: #0f172a;
            --bottom-nav-bg: #1e293b;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px 12px 90px 12px; transition: background-color 0.3s, color 0.3s; }
        .container { max-width: 600px; margin: 0 auto; }

        /* Splash Screen */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .splash-title {
            font-size: 44px; font-weight: 900; color: #000000; letter-spacing: 3px;
            animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; transform: scale(0.6);
        }
        .splash-tagline {
            margin-top: 8px; font-size: 14px; font-weight: 700; color: #1e3a8a; letter-spacing: 1px;
            animation: fadeIn 0.7s ease 0.3s forwards; opacity: 0;
        }
        @keyframes popIn { to { opacity: 1; transform: scale(1); } }
        @keyframes fadeIn { to { opacity: 1; } }

        /* Top Bar & Instant Search */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .brand-logo { font-size: 16px; font-weight: 800; color: #1e3a8a; display: flex; align-items: center; gap: 6px; }
        body.dark-mode .brand-logo { color: #60a5fa; }
        .theme-toggle {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 700;
            color: var(--text-main); box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .search-box-wrapper { margin-bottom: 12px; }
        .search-input {
            width: 100%; padding: 10px 14px; font-size: 13px; font-weight: 600;
            border: 1px solid var(--border-color); border-radius: 12px;
            background: var(--card-bg); color: var(--text-main); outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        /* Banner Dashboard */
        .dashboard-banner {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: var(--card-radius); padding: 16px; margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .main-balance-box {
            text-align: center; padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color); margin-bottom: 10px;
        }
        .main-balance-box span { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .main-balance-box h2 { font-size: 28px; font-weight: 800; color: var(--accent-blue); margin-top: 2px; }

        /* Visual Progress Bar */
        .visual-bar-container {
            height: 8px; width: 100%; background: var(--input-bg); border-radius: 4px;
            overflow: hidden; display: flex; margin-bottom: 12px; border: 1px solid var(--border-color);
        }
        .bar-get { background: var(--in-color); transition: width 0.3s; }
        .bar-give { background: var(--out-color); transition: width 0.3s; }

        .sub-analytics { display: flex; justify-content: space-around; text-align: center; }
        .sub-box span { font-size: 11px; font-weight: 700; color: var(--text-muted); }
        .sub-box h4 { font-size: 15px; font-weight: 800; margin-top: 2px; }

        .view-panel { display: none; }
        .view-panel.active { display: block; }

        /* Cards & Styling */
        .add-box, .card {
            background: var(--card-bg); border: 1px solid var(--border-color); padding: 16px;
            border-radius: var(--card-radius); margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.02);
            position: relative; overflow: hidden; transition: all 0.3s ease;
        }
        .add-box.hidden-on-search { display: none !important; }
        
        .card.strip-in { border-left: 5px solid var(--in-color); }
        .card.strip-out { border-left: 5px solid var(--out-color); }
        .card.strip-neutral { border-left: 5px solid var(--accent-blue); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-title { font-size: 16px; font-weight: 800; color: var(--text-main); }
        .card-balance { font-size: 16px; font-weight: 800; text-align: right; }

        .pill-indicator {
            display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; margin-top: 4px;
        }
        .pill-get { background: var(--in-bg); color: var(--in-color); }
        .pill-give { background: var(--out-bg); color: var(--out-color); }

        .bank-mini-stats {
            display: flex; gap: 8px; margin-top: 10px; font-size: 11px; color: var(--text-muted); font-weight: 700;
            background: var(--input-bg); padding: 6px 10px; border-radius: 8px;
        }

        /* Direct Quick Action Buttons */
        .quick-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn-quick-in { background: var(--in-color); color: white; border: none; padding: 8px 12px; font-size: 12px; font-weight: 700; border-radius: 10px; flex: 1; cursor: pointer; }
        .btn-quick-out { background: var(--out-color); color: white; border: none; padding: 8px 12px; font-size: 12px; font-weight: 700; border-radius: 10px; flex: 1; cursor: pointer; }

        .toggle-btn {
            background: var(--input-bg); color: var(--accent-blue); border: 1px solid var(--border-color);
            padding: 8px 12px; font-size: 11px; font-weight: 700; border-radius: 10px; cursor: pointer;
            margin-top: 10px; width: 100%; text-align: center;
        }
        .card-body { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border-color); }
        .card-body.open { display: block; }

        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 10px; margin-bottom: 4px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        input, select {
            width: 100%; padding: 10px 12px; font-size: 13px; border: 1px solid var(--border-color);
            border-radius: 10px; outline: none; background-color: var(--input-bg); color: var(--text-main); font-weight: 600;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 9000; padding: 16px;
        }
        .modal-card {
            background: var(--card-bg); width: 100%; max-width: 440px; border-radius: 20px;
            padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); position: relative; border: 1px solid var(--border-color);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .modal-title { font-size: 16px; font-weight: 800; color: var(--text-main); }
        .close-modal { font-size: 20px; font-weight: 800; border: none; background: none; color: var(--text-muted); cursor: pointer; }

        /* Date Quick Chips */
        .date-chips { display: flex; gap: 6px; margin-top: 6px; }
        .chip {
            padding: 4px 10px; font-size: 11px; font-weight: 700; border-radius: 8px;
            background: var(--input-bg); border: 1px solid var(--border-color); cursor: pointer; color: var(--text-muted);
        }
        .chip.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }

        /* Quick Filter Pills */
        .pill-filters { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 4px; }
        .filter-pill {
            background: var(--input-bg); border: 1px solid var(--border-color); padding: 5px 10px; font-size: 11px;
            font-weight: 700; border-radius: 16px; cursor: pointer; color: var(--text-muted); white-space: nowrap;
        }
        .filter-pill.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }

        /* Buttons */
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        button { padding: 10px 14px; font-size: 12px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-in { background: var(--in-color); color: white; flex: 1; }
        .btn-out { background: var(--out-color); color: white; flex: 1; }
        .btn-primary { background: #1e3a8a; color: white; width: 100%; }
        body.dark-mode .btn-primary { background: var(--accent-blue); }
        .btn-export { background: #0284c7; color: white; padding: 4px 8px; font-size: 10px; border-radius: 6px; }

        .action-btns { display: flex; gap: 4px; margin-top: 4px; }
        .btn-sm { padding: 3px 8px; font-size: 10px; border-radius: 6px; }
        .btn-edit { background: #f59e0b; color: white; }
        .btn-del { background: #ef4444; color: white; }

        /* History Table */
        .table-wrapper { overflow-x: auto; margin-top: 10px; border-radius: 10px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: left; }
        th { background: var(--input-bg); color: var(--text-muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--border-color); }
        td { padding: 8px 10px; border-bottom: 1px solid var(--border-color); color: var(--text-main); font-weight: 600; }
        .badge-in { background: var(--in-bg); color: var(--in-color); padding: 2px 6px; border-radius: 10px; font-weight: 700; }
        .badge-out { background: var(--out-bg); color: var(--out-color); padding: 2px 6px; border-radius: 10px; font-weight: 700; }
        .empty-msg { font-size: 12px; color: var(--text-muted); text-align: center; padding: 12px 0; font-weight: 600; }

        /* Fixed Bottom Navigation Bar */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bottom-nav-bg);
            border-top: 1px solid var(--border-color); display: flex; justify-content: space-around;
            align-items: center; padding: 8px 0; z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.04);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 700;
            color: var(--text-muted); text-decoration: none; cursor: pointer; flex: 1; border: none; background: none;
        }
        .nav-item.active { color: var(--accent-blue); }
        .nav-icon { font-size: 18px; margin-bottom: 2px; }

        /* Footer */
        .app-footer { text-align: center; margin-top: 20px; padding-top: 10px; font-size: 12px; font-weight: 700; color: var(--text-muted); }
        .app-footer span { color: var(--accent-blue); }

        /* A4 Printable Layout */
        @media print {
            @page { size: A4; margin: 15mm; }
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area {
                position: absolute; left: 0; top: 0; width: 100%;
                color: #000 !important; background: #fff !important; padding: 0 !important;
            }
            .bottom-nav, .btn-sm, .action-btns, .theme-toggle, .add-box, .toggle-btn, .quick-actions, .pill-filters, .modal-overlay, .search-box-wrapper { display: none !important; }
            .pdf-watermark-header { display: block !important; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #1e3a8a; padding-bottom: 10px; }
            .table-wrapper { border: 1px solid #000 !important; }
            th, td { border-bottom: 1px solid #000 !important; color: #000 !important; }
        }
        .pdf-watermark-header { display: none; }
    </style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash-screen">
    <div class="splash-title">KHATA</div>
    <div class="splash-tagline">Concept by Rajesh</div>
</div>

<div class="container">
    <div class="top-bar">
        <span class="brand-logo">📖 KHATA</span>
        <button class="theme-toggle" onclick="toggleDarkMode()">🌙 / ☀️ Mode</button>
    </div>

    <!-- Instant Search Bar -->
    <div class="search-box-wrapper">
        <input type="text" id="globalSearch" class="search-input" placeholder="🔎 Search Bank or Person Name..." onfocus="onSearchFocus()" onblur="onSearchBlur()" onkeyup="filterCards()">
    </div>

    <!-- Summary Dashboard -->
    <div class="dashboard-banner">
        <div class="main-balance-box">
            <span>Total Available Bank Balance</span>
            <h2 id="dashTotalBalance">₹0</h2>
        </div>
        
        <!-- Visual Progress Bar -->
        <div class="visual-bar-container">
            <div id="barGet" class="bar-get" style="width: 50%;"></div>
            <div id="barGive" class="bar-give" style="width: 50%;"></div>
        </div>

        <div class="sub-analytics">
            <div class="sub-box">
                <span>You Will Get (लेना है)</span>
                <h4 id="dashTotalGet" style="color: var(--in-color);">₹0</h4>
            </div>
            <div class="sub-box" style="border-left: 1px solid var(--border-color); padding-left: 10px;">
                <span>You Will Give (देना है)</span>
                <h4 id="dashTotalGive" style="color: var(--out-color);">₹0</h4>
            </div>
        </div>
    </div>

    <!-- ================= ACCOUNTS VIEW ================= -->
    <div id="accountsView" class="view-panel active">
        <div class="add-box" id="addBankBox">
            <h4 style="font-size: 14px; margin-bottom: 8px; font-weight: 800;">Add New Bank Account</h4>
            <div class="form-group">
                <input type="text" id="newBankName" placeholder="Bank Name (e.g., Bank of Baroda)">
            </div>
            <div class="form-group">
                <input type="number" id="newBankBalance" placeholder="Opening Balance (₹)">
            </div>
            <button class="btn-primary" onclick="addBank()">Add Bank Account</button>
        </div>

        <h3 style="font-size: 13px; margin-bottom: 8px; color: var(--text-muted); font-weight: 800;">YOUR BANKS</h3>
        <div id="banksList"></div>
    </div>

    <!-- ================= PERSONS VIEW ================= -->
    <div id="personsView" class="view-panel">
        <div class="add-box" id="addPersonBox">
            <h4 style="font-size: 14px; margin-bottom: 8px; font-weight: 800;">Add New Person / Head</h4>
            <div class="form-group">
                <input type="text" id="newPersonName" placeholder="Person / Head Name (e.g., Ashutosh)">
            </div>
            <button class="btn-primary" onclick="addPerson()">Add Person</button>
        </div>

        <h3 style="font-size: 13px; margin-bottom: 8px; color: var(--text-muted); font-weight: 800;">PERSONS / HEADS</h3>
        <div id="personsList"></div>
    </div>

    <!-- Footer Credit -->
    <div class="app-footer">
        Concept by <span>Rajesh</span>
    </div>
</div>

<!-- Quick Entry Modal Popup -->
<div id="entryModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <span class="modal-title" id="modalTitle">Add Transaction</span>
            <button class="close-modal" onclick="closeModal()">✕</button>
        </div>
        <div id="modalFormContent"></div>
    </div>
</div>

<!-- Mobile Bottom Navigation Bar -->
<div class="bottom-nav">
    <button class="nav-item active" id="nav_accounts" onclick="switchTab('accounts')">
        <span class="nav-icon">🏦</span>
        <span>Accounts</span>
    </button>
    <button class="nav-item" id="nav_persons" onclick="switchTab('persons')">
        <span class="nav-icon">👤</span>
        <span>Persons</span>
    </button>
</div>

<script>
    // Splash Screen
    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }
        }, 1600);
    });

    let state = JSON.parse(localStorage.getItem('ledgerAppV12')) || {
        banks: [],
        persons: [],
        transactions: [],
        darkMode: false
    };

    if (state.darkMode) document.body.classList.add('dark-mode');

    function toggleDarkMode() {
        state.darkMode = !state.darkMode;
        document.body.classList.toggle('dark-mode');
        saveData();
    }

    function saveData() {
        localStorage.setItem('ledgerAppV12', JSON.stringify(state));
        render();
    }

    function switchTab(tab) {
        document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
        
        if(tab === 'accounts') {
            document.getElementById('nav_accounts').classList.add('active');
            document.getElementById('accountsView').classList.add('active');
        } else {
            document.getElementById('nav_persons').classList.add('active');
            document.getElementById('personsView').classList.add('active');
        }
    }

    function toggleCardBody(id) {
        const bodyElem = document.getElementById(id);
        const btnElem = document.getElementById('btn_' + id);
        if (bodyElem.classList.contains('open')) {
            bodyElem.classList.remove('open');
            btnElem.innerText = '🔽 Open Entry & History';
        } else {
            bodyElem.classList.add('open');
            btnElem.innerText = '🔼 Hide Details';
        }
    }

    function openModal(title, htmlContent) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalFormContent').innerHTML = htmlContent;
        document.getElementById('entryModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('entryModal').style.display = 'none';
    }

    // Search focus/blur handling to hide creation boxes
    function onSearchFocus() {
        const addBank = document.getElementById('addBankBox');
        const addPerson = document.getElementById('addPersonBox');
        if(addBank) addBank.classList.add('hidden-on-search');
        if(addPerson) addPerson.classList.add('hidden-on-search');
    }

    function onSearchBlur() {
        const query = document.getElementById('globalSearch').value.trim();
        if(!query) {
            const addBank = document.getElementById('addBankBox');
            const addPerson = document.getElementById('addPersonBox');
            if(addBank) addBank.classList.remove('hidden-on-search');
            if(addPerson) addPerson.classList.remove('hidden-on-search');
        }
    }

    function filterCards() {
        const query = document.getElementById('globalSearch').value.toLowerCase();
        document.querySelectorAll('.card').forEach(card => {
            const title = card.querySelector('.card-title').innerText.toLowerCase();
            if(title.includes(query)) card.style.display = '';
            else card.style.display = 'none';
        });
    }

    function addBank() {
        const name = document.getElementById('newBankName').value.trim();
        const openingBalance = parseFloat(document.getElementById('newBankBalance').value) || 0;
        if(!name) return alert('Please enter Bank Name');
        
        state.banks.push({ id: 'b_' + Date.now(), name, openingBalance, balance: openingBalance });
        document.getElementById('newBankName').value = '';
        document.getElementById('newBankBalance').value = '';
        saveData();
    }

    function editBank(bankId) {
        const bank = state.banks.find(b => b.id === bankId);
        if(!bank) return;
        const newName = prompt("Update Bank Name:", bank.name);
        if(newName === null) return;
        const newOpBal = prompt("Update Opening Balance (₹):", bank.openingBalance || bank.balance);
        if(newOpBal === null || isNaN(parseFloat(newOpBal))) return;

        bank.name = newName.trim() || bank.name;
        bank.openingBalance = parseFloat(newOpBal);
        
        recalculateBankBalance(bank.id);
        state.transactions.forEach(t => { if(t.bankId === bankId) t.bankName = bank.name; });
        saveData();
    }

    function recalculateBankBalance(bankId) {
        const bank = state.banks.find(b => b.id === bankId);
        if(!bank) return;
        let bal = bank.openingBalance || 0;
        state.transactions.forEach(t => {
            if(t.bankId === bankId) {
                if(t.type === 'IN') bal += t.amount;
                if(t.type === 'OUT') bal -= t.amount;
            }
        });
        bank.balance = bal;
    }

    function deleteBank(bankId) {
        if(!confirm("Are you sure you want to delete this Bank Account?")) return;
        state.banks = state.banks.filter(b => b.id !== bankId);
        state.transactions = state.transactions.filter(t => t.bankId !== bankId);
        saveData();
    }

    function addPerson() {
        const name = document.getElementById('newPersonName').value.trim();
        if(!name) return alert('Please enter Person Name');
        
        state.persons.push({ id: 'p_' + Date.now(), name });
        document.getElementById('newPersonName').value = '';
        saveData();
    }

    function editPerson(personId) {
        const person = state.persons.find(p => p.id === personId);
        if(!person) return;
        const newName = prompt("Update Person Name:", person.name);
        if(!newName || !newName.trim()) return;

        person.name = newName.trim();
        state.transactions.forEach(t => { if(t.personId === personId) t.personName = person.name; });
        saveData();
    }

    function deletePerson(personId) {
        if(!confirm("Are you sure you want to delete this Person?")) return;
        state.persons = state.persons.filter(p => p.id !== personId);
        state.transactions = state.transactions.filter(t => t.personId !== personId);
        saveData();
    }

    // Dropdown create handlers inside modal
    function handleModalPersonDropdown() {
        const selectElem = document.getElementById('modal_select_person');
        if (selectElem && selectElem.value === 'CREATE_NEW') {
            const newName = prompt("Enter new Person / Head Name:");
            if (newName && newName.trim()) {
                const newPersonId = 'p_' + Date.now();
                state.persons.push({ id: newPersonId, name: newName.trim() });
                saveData();
                // Refresh modal content dynamically with updated person list
                const activeEntityId = selectElem.getAttribute('data-entity-id');
                const activeAction = selectElem.getAttribute('data-action');
                quickEntryModal(activeEntityId, 'BANK', activeAction);
                document.getElementById('modal_select_person').value = newPersonId;
            } else {
                selectElem.value = "";
            }
        }
    }

    function handleModalBankDropdown() {
        const selectElem = document.getElementById('modal_select_bank');
        if (selectElem && selectElem.value === 'CREATE_NEW') {
            const newName = prompt("Enter new Bank Account Name:");
            if (newName && newName.trim()) {
                const newBankBal = prompt("Enter Opening Balance (₹):", "0");
                const newBankId = 'b_' + Date.now();
                const opBal = parseFloat(newBankBal) || 0;
                state.banks.push({ id: newBankId, name: newName.trim(), openingBalance: opBal, balance: opBal });
                saveData();
                // Refresh modal content dynamically with updated bank list
                const activeEntityId = selectElem.getAttribute('data-entity-id');
                const activeAction = selectElem.getAttribute('data-action');
                quickEntryModal(activeEntityId, 'PERSON', activeAction);
                document.getElementById('modal_select_bank').value = newBankId;
            } else {
                selectElem.value = "";
            }
        }
    }

    function setQuickDate(targetInputId, type, btnElement) {
        const parent = btnElement.parentElement;
        parent.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        btnElement.classList.add('active');

        const inputElem = document.getElementById(targetInputId);
        const today = new Date();

        if(type === 'TODAY') {
            inputElem.value = today.toISOString().split('T')[0];
        } else if(type === 'YESTERDAY') {
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            inputElem.value = yesterday.toISOString().split('T')[0];
        }
    }

    function quickEntryModal(entityId, entityType, actionType) {
        let entityName = "";
        let dropdownHtml = "";

        if(entityType === 'BANK') {
            const bank = state.banks.find(b => b.id === entityId);
            entityName = bank ? bank.name : "";
            let personOpts = state.persons.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            personOpts += `<option value="CREATE_NEW" style="font-weight: bold; color: var(--accent-blue);">+ Create New Person</option>`;
            
            dropdownHtml = `
                <div class="form-group">
                    <label>Select Person/Head</label>
                    <select id="modal_select_person" data-entity-id="${entityId}" data-action="${actionType}" onchange="handleModalPersonDropdown()">
                        <option value="">-- Select Person --</option>
                        ${personOpts}
                    </select>
                </div>
            `;
        } else {
            const person = state.persons.find(p => p.id === entityId);
            entityName = person ? person.name : "";
            let bankOpts = state.banks.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
            bankOpts += `<option value="CREATE_NEW" style="font-weight: bold; color: var(--accent-blue);">+ Create New Bank Account</option>`;
            
            dropdownHtml = `
                <div class="form-group">
                    <label>Select Bank Account</label>
                    <select id="modal_select_bank" data-entity-id="${entityId}" data-action="${actionType}" onchange="handleModalBankDropdown()">
                        <option value="">-- Select Bank --</option>
                        ${bankOpts}
                    </select>
                </div>
            `;
        }

        const html = `
            ${dropdownHtml}
            <div class="form-group">
                <label>Amount (₹)</label>
                <input type="number" id="modal_amount" placeholder="0.00" autofocus>
            </div>
            <div class="form-group">
                <label>Description / Note</label>
                <input type="text" id="modal_desc" placeholder="e.g., Petrol, Rent, Cash...">
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="modal_date" value="${getTodayInputFormat()}">
                <div class="date-chips">
                    <span class="chip active" onclick="setQuickDate('modal_date', 'TODAY', this)">Today</span>
                    <span class="chip" onclick="setQuickDate('modal_date', 'YESTERDAY', this)">Yesterday</span>
                </div>
            </div>
            <button class="${actionType === 'IN' ? 'btn-in' : 'btn-out'}" style="width:100%; margin-top:10px;" onclick="submitModalTrans('${entityId}', '${entityType}', '${actionType}')">
                Save ${actionType} Entry
            </button>
        `;

        openModal(`${actionType === 'IN' ? '+ Receive Money (IN)' : '- Pay Money (OUT)'} - ${entityName}`, html);
    }

    function submitModalTrans(entityId, entityType, actionType) {
        const amount = parseFloat(document.getElementById('modal_amount').value);
        const desc = document.getElementById('modal_desc').value.trim() || 'No description';
        const customDate = document.getElementById('modal_date').value;

        let bankId = "", personId = "";
        if(entityType === 'BANK') {
            bankId = entityId;
            personId = document.getElementById('modal_select_person').value;
        } else {
            personId = entityId;
            bankId = document.getElementById('modal_select_bank').value;
        }

        if(!amount || amount <= 0) return alert('Please enter valid amount');
        if(!bankId || !personId) return alert('Please select both Bank and Person');

        const bank = state.banks.find(b => b.id === bankId);
        const person = state.persons.find(p => p.id === personId);

        let formattedDate = new Date().toLocaleDateString('en-IN');
        if(customDate) {
            formattedDate = new Date(customDate).toLocaleDateString('en-IN');
        }

        state.transactions.unshift({
            id: 't_' + Date.now(),
            bankId: bank.id,
            bankName: bank.name,
            personId: person.id,
            personName: person.name,
            type: actionType,
            amount,
            description: desc,
            date: formattedDate
        });

        recalculateBankBalance(bank.id);
        closeModal();
        saveData();
    }

    function editTransaction(transId) {
        const t = state.transactions.find(trans => trans.id === transId);
        if(!t) return;

        const newAmountStr = prompt("Edit Transaction Amount (₹):", t.amount);
        if(newAmountStr === null || isNaN(parseFloat(newAmountStr))) return;
        const newAmount = parseFloat(newAmountStr);

        const newDesc = prompt("Edit Description / Note:", t.description);
        if(newDesc === null) return;

        t.amount = newAmount;
        t.description = newDesc.trim() || 'No description';

        recalculateBankBalance(t.bankId);
        saveData();
    }

    function deleteTransaction(transId) {
        if(!confirm("Delete this transaction? Bank balance will be adjusted.")) return;
        const transIndex = state.transactions.findIndex(t => t.id === transId);
        if(transIndex === -1) return;

        const bankId = state.transactions[transIndex].bankId;
        state.transactions.splice(transIndex, 1);
        
        recalculateBankBalance(bankId);
        saveData();
    }

    function exportToCSV(entityName, transactions) {
        if(!transactions || transactions.length === 0) return alert('No transactions to export!');
        let csvContent = "\uFEFFDate,Details,Type,Amount (INR),Note\n";
        transactions.forEach(t => {
            csvContent += `"${t.date}","${t.personName} / ${t.bankName}","${t.type}","${t.amount}","${t.description}"\n`;
        });
        
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `${entityName.replace(/\s+/g, '_')}_Statement.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Direct A4 Printable PDF Clean Save
    function exportToPDF(containerId) {
        const targetElement = document.getElementById(containerId);
        if (!targetElement) return alert('No data to export!');

        document.querySelectorAll('.print-area').forEach(el => el.classList.remove('print-area'));
        targetElement.classList.add('print-area');
        window.print();
    }

    function setFilterPill(filterType, containerId, event) {
        const pills = document.querySelectorAll(`#pills_${containerId} .filter-pill`);
        pills.forEach(p => p.classList.remove('active'));
        if(event) event.target.classList.add('active');

        const rows = document.querySelectorAll(`#${containerId} tbody tr`);
        const todayStr = new Date().toLocaleDateString('en-IN');

        rows.forEach(row => {
            const type = row.getAttribute('data-type');
            const dateStr = row.getAttribute('data-date');

            let show = false;
            if(filterType === 'ALL') show = true;
            else if(filterType === 'IN' && type === 'IN') show = true;
            else if(filterType === 'OUT' && type === 'OUT') show = true;
            else if(filterType === 'TODAY' && dateStr === todayStr) show = true;

            row.style.display = show ? '' : 'none';
        });
    }

    function getTodayInputFormat() {
        return new Date().toISOString().split('T')[0];
    }

    function render() {
        // --- Calculate Dashboard ---
        let totalNet = 0;
        state.banks.forEach(b => {
            recalculateBankBalance(b.id);
            totalNet += b.balance;
        });

        let totalGet = 0, totalGive = 0;
        state.persons.forEach(person => {
            const personTrans = state.transactions.filter(t => t.personId === person.id);
            let pBal = 0;
            personTrans.forEach(t => {
                if(t.type === 'OUT') pBal += t.amount;
                if(t.type === 'IN') pBal -= t.amount;
            });
            if(pBal > 0) totalGet += pBal;
            if(pBal < 0) totalGive += Math.abs(pBal);
        });

        document.getElementById('dashTotalBalance').innerText = '₹' + totalNet.toLocaleString('en-IN');
        document.getElementById('dashTotalGet').innerText = '₹' + totalGet.toLocaleString('en-IN');
        document.getElementById('dashTotalGive').innerText = '₹' + totalGive.toLocaleString('en-IN');

        // Visual Progress Bar Logic
        const totalSum = totalGet + totalGive;
        if(totalSum > 0) {
            document.getElementById('barGet').style.width = ((totalGet / totalSum) * 100) + '%';
            document.getElementById('barGive').style.width = ((totalGive / totalSum) * 100) + '%';
        } else {
            document.getElementById('barGet').style.width = '50%';
            document.getElementById('barGive').style.width = '50%';
        }

        // --- Render Accounts View ---
        const banksList = document.getElementById('banksList');
        banksList.innerHTML = '';

        if (state.banks.length === 0) {
            banksList.innerHTML = '<p class="empty-msg">No bank accounts added yet.</p>';
        } else {
            state.banks.forEach(bank => {
                const bankTrans = state.transactions.filter(t => t.bankId === bank.id);
                let bIn = 0, bOut = 0;
                bankTrans.forEach(t => { if(t.type==='IN') bIn+=t.amount; else bOut+=t.amount; });

                const card = document.createElement('div');
                card.className = 'card strip-neutral';
                card.id = `card_bank_${bank.id}`;
                card.innerHTML = `
                    <div class="pdf-watermark-header">
                        <h2 style="font-size:24px; color:#1e3a8a; font-weight:800;">KHATA</h2>
                        <p style="font-size:12px; color:#64748b;">Concept by Rajesh | Statement for ${bank.name}</p>
                        <p style="font-size:11px; color:#64748b;">Generated Date: ${new Date().toLocaleDateString('en-IN')}</p>
                    </div>
                    <div class="card-header">
                        <div>
                            <span class="card-title">🏦 ${bank.name}</span>
                            <div class="action-btns">
                                <button class="btn-sm btn-edit" onclick="editBank('${bank.id}')">Edit</button>
                                <button class="btn-sm btn-del" onclick="deleteBank('${bank.id}')">Delete</button>
                            </div>
                        </div>
                        <div>
                            <div class="card-balance">₹${bank.balance.toLocaleString('en-IN')}</div>
                            <div style="font-size: 10px; color: var(--text-muted); text-align:right; font-weight:700;">Current Bal</div>
                        </div>
                    </div>

                    <div class="bank-mini-stats">
                        <span>Op: ₹${(bank.openingBalance || 0).toLocaleString('en-IN')}</span> |
                        <span style="color:var(--in-color);">IN: ₹${bIn.toLocaleString('en-IN')}</span> |
                        <span style="color:var(--out-color);">OUT: ₹${bOut.toLocaleString('en-IN')}</span>
                    </div>

                    <div class="quick-actions">
                        <button class="btn-quick-in" onclick="quickEntryModal('${bank.id}', 'BANK', 'IN')">+ IN</button>
                        <button class="btn-quick-out" onclick="quickEntryModal('${bank.id}', 'BANK', 'OUT')">- OUT</button>
                    </div>

                    <button class="toggle-btn" id="btn_body_bank_${bank.id}" onclick="toggleCardBody('body_bank_${bank.id}')">🔽 Open Entry & History</button>

                    <div class="card-body" id="body_bank_${bank.id}">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                            <span style="font-size:11px; font-weight:800; color:var(--text-muted);">HISTORY STATEMENT</span>
                            <div>
                                <button class="btn-export" onclick="exportToCSV('${bank.name}', state.transactions.filter(t => t.bankId === '${bank.id}'))">Excel</button>
                                <button class="btn-export" onclick="exportToPDF('card_bank_${bank.id}')">PDF</button>
                            </div>
                        </div>

                        ${renderHistoryTable(bankTrans, 'personName', `table_bank_${bank.id}`)}
                    </div>
                `;
                banksList.appendChild(card);
            });
        }

        // --- Render Persons View ---
        const personsList = document.getElementById('personsList');
        personsList.innerHTML = '';

        if (state.persons.length === 0) {
            personsList.innerHTML = '<p class="empty-msg">No persons added yet.</p>';
        } else {
            state.persons.forEach(person => {
                const personTrans = state.transactions.filter(t => t.personId === person.id);

                let personBalance = 0;
                personTrans.forEach(t => {
                    if(t.type === 'OUT') personBalance += t.amount;
                    if(t.type === 'IN') personBalance -= t.amount;
                });

                const card = document.createElement('div');
                card.className = `card ${personBalance >= 0 ? 'strip-in' : 'strip-out'}`;
                card.id = `card_person_${person.id}`;
                card.innerHTML = `
                    <div class="pdf-watermark-header">
                        <h2 style="font-size:24px; color:#1e3a8a; font-weight:800;">KHATA</h2>
                        <p style="font-size:12px; color:#64748b;">Concept by Rajesh | Statement for ${person.name}</p>
                        <p style="font-size:11px; color:#64748b;">Generated Date: ${new Date().toLocaleDateString('en-IN')}</p>
                    </div>
                    <div class="card-header">
                        <div>
                            <span class="card-title">👤 ${person.name}</span>
                            <div class="action-btns">
                                <button class="btn-sm btn-edit" onclick="editPerson('${person.id}')">Edit</button>
                                <button class="btn-sm btn-del" onclick="deletePerson('${person.id}')">Delete</button>
                            </div>
                        </div>
                        <div style="text-align:right;">
                            <span class="card-balance" style="color: ${personBalance >= 0 ? 'var(--in-color)' : 'var(--out-color)'}">
                                ${personBalance >= 0 ? '₹' + personBalance.toLocaleString('en-IN') : '₹' + Math.abs(personBalance).toLocaleString('en-IN')}
                            </span><br>
                            <span class="pill-indicator ${personBalance >= 0 ? 'pill-get' : 'pill-give'}">
                                ${personBalance >= 0 ? 'To Get' : 'To Give'}
                            </span>
                        </div>
                    </div>

                    <div class="quick-actions">
                        <button class="btn-quick-in" onclick="quickEntryModal('${person.id}', 'PERSON', 'IN')">+ IN</button>
                        <button class="btn-quick-out" onclick="quickEntryModal('${person.id}', 'PERSON', 'OUT')">- OUT</button>
                    </div>

                    <button class="toggle-btn" id="btn_body_person_${person.id}" onclick="toggleCardBody('body_person_${person.id}')">🔽 Open Entry & History</button>

                    <div class="card-body" id="body_person_${person.id}">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                            <span style="font-size:11px; font-weight:800; color:var(--text-muted);">HISTORY STATEMENT</span>
                            <div>
                                <button class="btn-export" onclick="exportToCSV('${person.name}', state.transactions.filter(t => t.personId === '${person.id}'))">Excel</button>
                                <button class="btn-export" onclick="exportToPDF('card_person_${person.id}')">PDF</button>
                            </div>
                        </div>

                        ${renderHistoryTable(personTrans, 'bankName', `table_person_${person.id}`)}
                    </div>
                `;
                personsList.appendChild(card);
            });
        }
    }

    function renderHistoryTable(transactions, relatedField, containerId) {
        if(transactions.length === 0) return '<p class="empty-msg">No transactions recorded.</p>';
        
        let rows = transactions.map(t => `
            <tr data-type="${t.type}" data-date="${t.date}">
                <td>
                    <strong>${t[relatedField]}</strong><br>
                    <span style="font-size: 10px; color: var(--text-muted);">${t.description}</span>
                </td>
                <td><span class="${t.type === 'IN' ? 'badge-in' : 'badge-out'}">${t.type}</span></td>
                <td><strong>₹${t.amount.toLocaleString('en-IN')}</strong></td>
                <td style="color:var(--text-muted);">${t.date}</td>
                <td style="text-align:center;">
                    <button class="btn-sm btn-edit" onclick="editTransaction('${t.id}')">✏️</button>
                    <button class="btn-sm btn-del" onclick="deleteTransaction('${t.id}')">✕</button>
                </td>
            </tr>
        `).join('');

        return `
            <div class="pill-filters" id="pills_${containerId}">
                <button class="filter-pill active" onclick="setFilterPill('ALL', '${containerId}', event)">All</button>
                <button class="filter-pill" onclick="setFilterPill('TODAY', '${containerId}', event)">Today</button>
                <button class="filter-pill" onclick="setFilterPill('IN', '${containerId}', event)">IN Only</button>
                <button class="filter-pill" onclick="setFilterPill('OUT', '${containerId}', event)">OUT Only</button>
            </div>
            <div class="table-wrapper" id="${containerId}">
                <table>
                    <thead>
                        <tr><th>Details</th><th>Type</th><th>Amount</th><th>Date</th><th>Action</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
        `;
    }

    render();
</script>

</body>
</html>
