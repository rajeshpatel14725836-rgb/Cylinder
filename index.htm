<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पर्सनल लेजर एवं बैंक मैनेजर</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --in-color: #27ae60;
            --out-color: #e74c3c;
            --bg: #f4f7f6;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); padding: 15px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        
        /* Top Navigation Switch */
        .nav-tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: bold; font-size: 16px; background: none; border: none; cursor: pointer; color: #777; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .view-panel { display: none; }
        .view-panel.active { display: block; }

        /* Card Component */
        .card { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-title { font-size: 18px; font-weight: bold; color: var(--primary); }
        .card-balance { font-size: 16px; font-weight: bold; }

        /* Forms & Inputs */
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; font-weight: 600; color: #555; }
        input, select { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 10px 15px; font-size: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-in { background: var(--in-color); color: white; flex: 1; }
        .btn-out { background: var(--out-color); color: white; flex: 1; }
        .btn-primary { background: var(--accent); color: white; width: 100%; }

        /* History Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #eee; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .txt-in { color: var(--in-color); font-weight: bold; }
        .txt-out { color: var(--out-color); font-weight: bold; }
        
        .add-box { background: #eef6fb; border: 1px dashed var(--accent); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Navigation Switcher -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('accounts')">🏦 Accounts View</button>
        <button class="tab-btn" onclick="switchTab('persons')">👤 Persons / Heads View</button>
    </div>

    <!-- ================= ACCOUNTS VIEW ================= -->
    <div id="accountsView" class="view-panel active">
        <!-- Add New Bank Form -->
        <div class="add-box">
            <h4 style="margin-bottom:10px;">नया बैंक खाता जोड़ें</h4>
            <div class="form-group">
                <input type="text" id="newBankName" placeholder="बैंक का नाम (उदा. Bank of Baroda)">
            </div>
            <div class="form-group">
                <input type="number" id="newBankBalance" placeholder="प्रारंभिक बैलेंस (Opening Balance)">
            </div>
            <button class="btn-primary" onclick="addBank()">बैंक खाता जोड़ें</button>
        </div>

        <h3>बैंक खातों की सूची</h3>
        <div id="banksList"></div>
    </div>

    <!-- ================= PERSONS VIEW ================= -->
    <div id="personsView" class="view-panel">
        <!-- Add New Person Form -->
        <div class="add-box">
            <h4 style="margin-bottom:10px;">नया Person / Head जोड़ें</h4>
            <div class="form-group">
                <input type="text" id="newPersonName" placeholder="व्यक्ति या हेड का नाम (उदा. Ashutosh)">
            </div>
            <button class="btn-primary" onclick="addPerson()">व्यक्ति जोड़ें</button>
        </div>

        <h3>व्यक्तियों / हेड्स की सूची</h3>
        <div id="personsList"></div>
    </div>
</div>

<script>
    // State Management (LocalStorage Based)
    let state = JSON.parse(localStorage.getItem('ledgerApp')) || {
        banks: [
            { id: 'b1', name: 'Bank of Baroda', balance: 10000 },
            { id: 'b2', name: 'Bank 2', balance: 5000 }
        ],
        persons: [
            { id: 'p1', name: 'Ashutosh' }
        ],
        transactions: []
    };

    function saveData() {
        localStorage.setItem('ledgerApp', JSON.stringify(state));
        render();
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
        
        if(tab === 'accounts') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('accountsView').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('personsView').classList.add('active');
        }
    }

    // Add New Bank
    function addBank() {
        const name = document.getElementById('newBankName').value.trim();
        const balance = parseFloat(document.getElementById('newBankBalance').value) || 0;
        if(!name) return alert('कृपया बैंक का नाम भरें');
        
        state.banks.push({ id: 'b_' + Date.now(), name, balance });
        document.getElementById('newBankName').value = '';
        document.getElementById('newBankBalance').value = '';
        saveData();
    }

    // Add New Person
    function addPerson() {
        const name = document.getElementById('newPersonName').value.trim();
        if(!name) return alert('कृपया व्यक्ति का नाम भरें');
        
        state.persons.push({ id: 'p_' + Date.now(), name });
        document.getElementById('newPersonName').value = '';
        saveData();
    }

    // Record Transaction
    function submitTransaction(bankId, personId, type, amountId) {
        const amount = parseFloat(document.getElementById(amountId).value);
        if(!amount || amount <= 0) return alert('कृपया सही राशि दर्ज करें');

        const bank = state.banks.find(b => b.id === bankId);
        const person = state.persons.find(p => p.id === personId);

        if(!bank || !person) return alert('कृपया बैंक और व्यक्ति दोनों सेलेक्ट करें');

        // Update Bank Balance
        if(type === 'IN') {
            bank.balance += amount; // पैसे आए तो बैंक बैलेंस बढ़ा
        } else {
            bank.balance -= amount; // पैसे गए तो बैंक बैलेंस घटा
        }

        // Add Transaction Record
        state.transactions.unshift({
            id: 't_' + Date.now(),
            bankId: bank.id,
            bankName: bank.name,
            personId: person.id,
            personName: person.name,
            type,
            amount,
            date: new Date().toLocaleDateString('hi-IN')
        });

        saveData();
    }

    // Render UI
    function render() {
        // --- 1. Render Accounts View ---
        const banksList = document.getElementById('banksList');
        banksList.innerHTML = '';

        state.banks.forEach(bank => {
            const personOptions = state.persons.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            const bankTrans = state.transactions.filter(t => t.bankId === bank.id);

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title">🏦 ${bank.name}</span>
                    <span class="card-balance">बैलेंस: ₹${bank.balance}</span>
                </div>
                <div class="form-group">
                    <label>किस व्यक्ति/हेड से लेन-देन हुआ?</label>
                    <select id="person_select_${bank.id}">
                        <option value="">-- व्यक्ति चुनें --</option>
                        ${personOptions}
                    </select>
                </div>
                <div class="form-group">
                    <input type="number" id="amount_bank_${bank.id}" placeholder="राशि (₹)">
                </div>
                <div class="btn-group">
                    <button class="btn-in" onclick="handleBankTrans('${bank.id}', 'IN')">+ IN (रुपये आए)</button>
                    <button class="btn-out" onclick="handleBankTrans('${bank.id}', 'OUT')">- OUT (रुपये गए)</button>
                </div>
                ${renderHistoryTable(bankTrans, 'personName')}
            `;
            banksList.appendChild(card);
        });

        // --- 2. Render Persons View ---
        const personsList = document.getElementById('personsList');
        personsList.innerHTML = '';

        state.persons.forEach(person => {
            const bankOptions = state.banks.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
            const personTrans = state.transactions.filter(t => t.personId === person.id);

            // Calculate Balance with Person
            let personBalance = 0;
            personTrans.forEach(t => {
                if(t.type === 'OUT') personBalance += t.amount; // आपने दिया
                if(t.type === 'IN') personBalance -= t.amount;  // उनसे लिया
            });

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title">👤 ${person.name}</span>
                    <span class="card-balance" style="color: ${personBalance >= 0 ? 'var(--in-color)' : 'var(--out-color)'}">
                        ${personBalance >= 0 ? 'लैन (देना बाकी): ₹' + personBalance : 'देन (लेना बाकी): ₹' + Math.abs(personBalance)}
                    </span>
                </div>
                <div class="form-group">
                    <label>किस बैंक खाते का उपयोग किया?</label>
                    <select id="bank_select_${person.id}">
                        <option value="">-- बैंक खाता चुनें --</option>
                        ${bankOptions}
                    </select>
                </div>
                <div class="form-group">
                    <input type="number" id="amount_person_${person.id}" placeholder="राशि (₹)">
                </div>
                <div class="btn-group">
                    <button class="btn-in" onclick="handlePersonTrans('${person.id}', 'IN')">+ IN (पैसे प्राप्त हुए)</button>
                    <button class="btn-out" onclick="handlePersonTrans('${person.id}', 'OUT')">- OUT (पैसे दिए)</button>
                </div>
                ${renderHistoryTable(personTrans, 'bankName')}
            `;
            personsList.appendChild(card);
        });
    }

    function handleBankTrans(bankId, type) {
        const personId = document.getElementById(`person_select_${bankId}`).value;
        submitTransaction(bankId, personId, type, `amount_bank_${bankId}`);
    }

    function handlePersonTrans(personId, type) {
        const bankId = document.getElementById(`bank_select_${personId}`).value;
        submitTransaction(bankId, personId, type, `amount_person_${personId}`);
    }

    function renderHistoryTable(transactions, relatedField) {
        if(transactions.length === 0) return '<p style="font-size:12px; color:#888; margin-top:10px;">कोई लेन-देन नहीं हुआ है।</p>';
        
        let rows = transactions.map(t => `
            <tr>
                <td>${t[relatedField]}</td>
                <td class="${t.type === 'IN' ? 'txt-in' : 'txt-out'}">${t.type}</td>
                <td>₹${t.amount}</td>
                <td>${t.date}</td>
            </tr>
        `).join('');

        return `
            <table>
                <thead>
                    <tr><th>विवरण</th><th>प्रकार</th><th>राशि</th><th>तारीख</th></tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        `;
    }

    // Initial Load
    render();
</script>

</body>
</html>
