<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Money Ledger</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    margin:0;
    background:#fff;
    color:#333;
}

/* HEADER */
.header{
    background:#0759ad;
    color:white;
    padding:20px 16px 0;
}

.title{
    font-size:24px;
    font-weight:bold;
}

.subtitle{
    margin-top:5px;
    opacity:.9;
}

.tabs{
    display:flex;
    gap:35px;
    margin-top:25px;
}

.tab{
    padding:12px 5px;
    font-weight:bold;
}

.tab.active{
    border-bottom:4px solid #ffc107;
}

/* SEARCH */
.search-area{
    display:flex;
    gap:10px;
    padding:16px;
}

.search{
    flex:1;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    font-size:17px;
}

.filter{
    border:1px solid #0759ad;
    background:white;
    color:#0759ad;
    border-radius:12px;
    padding:0 15px;
}

/* PERSON */
.person{
    display:flex;
    align-items:center;
    padding:14px;
    border-bottom:1px solid #eee;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#f1f1f1;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    margin-right:14px;
}

.person-info{
    flex:1;
}

.person-name{
    font-size:18px;
}

.time{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

.balance{
    font-size:20px;
    font-weight:bold;
}

.green{
    color:#087f52;
}

.red{
    color:#b5122e;
}

/* ADD BUTTON */
.add-person{
    position:fixed;
    right:20px;
    bottom:90px;
    border:0;
    border-radius:35px;
    background:#b00059;
    color:white;
    padding:18px 25px;
    font-weight:bold;
    font-size:16px;
}

/* BOTTOM */
.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:70px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.bottom button{
    background:none;
    border:0;
    font-size:14px;
    color:#555;
}

.bottom .active{
    color:#0759ad;
    font-weight:bold;
}

/* DETAIL */
.detail-header{
    background:#0759ad;
    color:white;
    padding:18px;
}

.back{
    font-size:28px;
    background:none;
    border:0;
    color:white;
}

.detail-name{
    font-size:24px;
    font-weight:bold;
}

.detail-balance{
    background:white;
    color:#444;
    padding:18px;
    margin-top:18px;
    border-radius:8px;
    font-size:19px;
}

.detail-balance span{
    float:right;
    color:#087f52;
    font-size:24px;
    font-weight:bold;
}

.detail-actions{
    display:flex;
    justify-content:space-around;
    padding:16px;
    border-bottom:1px solid #ddd;
    color:#0759ad;
}

/* TRANSACTIONS */
.transactions{
    background:#f1f3f5;
    min-height:55vh;
    padding:12px;
    padding-bottom:120px;
}

.transaction{
    background:white;
    border-radius:8px;
    margin:10px 0;
    padding:15px;
    display:grid;
    grid-template-columns:1fr 90px 90px;
    box-shadow:0 2px 5px #0001;
}

.transaction-date{
    font-size:14px;
}

.note{
    margin-top:10px;
    color:#666;
}

.gave{
    color:#b5122e;
    font-weight:bold;
    font-size:19px;
    text-align:right;
}

.got{
    color:#087f52;
    font-weight:bold;
    font-size:19px;
    text-align:right;
}

/* ACTION BUTTONS */
.actions{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    padding:12px;
    display:flex;
    gap:25px;
}

.actions button{
    flex:1;
    padding:18px;
    border:0;
    color:white;
    font-size:16px;
    font-weight:bold;
    border-radius:6px;
}

.gave-btn{
    background:#b5122e;
}

.got-btn{
    background:#087f52;
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:#0008;
    display:none;
    align-items:flex-end;
}

.modal-box{
    background:white;
    width:100%;
    padding:22px;
    border-radius:20px 20px 0 0;
}

.modal-box input,
.modal-box select{
    width:100%;
    padding:14px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:8px;
}

.save{
    width:100%;
    padding:15px;
    background:#0759ad;
    color:white;
    border:0;
    border-radius:8px;
    font-weight:bold;
}

.cancel{
    width:100%;
    padding:13px;
    border:0;
    margin-top:8px;
}

/* HIDDEN */
.page{
    display:none;
}

.page.active{
    display:block;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">

    <div class="header">

        <div class="title">
            My Money ✏️
        </div>

        <div class="subtitle">
            Personal Money Ledger
        </div>

        <div class="tabs">
            <div class="tab active">
                PEOPLE
            </div>

            <div class="tab">
                ACCOUNTS
            </div>
        </div>

    </div>


    <div class="search-area">

        <input
            id="search"
            class="search"
            placeholder="🔍 Search Person"
            oninput="showPeople()"
        >

        <button class="filter">
            ☰
        </button>

    </div>


    <div id="peopleList"></div>


    <button
        class="add-person"
        onclick="addPerson()"
    >
        ＋ ADD PERSON
    </button>

</div>



<!-- DETAIL -->
<div id="detail" class="page">

    <div class="detail-header">

        <button
            class="back"
            onclick="goHome()"
        >
            ←
        </button>

        <div
            id="detailName"
            class="detail-name"
        ></div>

        <div>
            Person
        </div>


        <div class="detail-balance">

            You will get

            <span id="detailBalance">
                ₹0
            </span>

        </div>

    </div>


    <div class="detail-actions">

        <div>
            📄<br>
            Report
        </div>

        <div>
            🔔<br>
            Reminder
        </div>

        <div>
            💬<br>
            SMS
        </div>

    </div>


    <div
        id="transactions"
        class="transactions"
    ></div>


    <div class="actions">

        <button
            class="gave-btn"
            onclick="transaction('gave')"
        >
            YOU GAVE ₹
        </button>

        <button
            class="got-btn"
            onclick="transaction('got')"
        >
            YOU GOT ₹
        </button>

    </div>

</div>



<!-- MODAL -->
<div
    id="modal"
    class="modal"
>

    <div class="modal-box">

        <h2 id="modalTitle">
            Transaction
        </h2>


        <label>
            Amount
        </label>

        <input
            id="amount"
            type="number"
            placeholder="Enter amount"
        >


        <label>
            Account
        </label>

        <select id="account">

            <option value="Bank of Baroda">
                Bank of Baroda
            </option>

            <option value="SBI">
                SBI
            </option>

            <option value="Cash">
                Cash
            </option>

        </select>


        <label>
            Note
        </label>

        <input
            id="note"
            placeholder="Example: dinner / transfer"
        >


        <button
            class="save"
            onclick="saveTransaction()"
        >
            SAVE
        </button>

        <button
            class="cancel"
            onclick="closeModal()"
        >
            CANCEL
        </button>

    </div>

</div>



<div class="bottom">

    <button
        class="active"
        onclick="goHome()"
    >
        👥<br>
        People
    </button>

    <button
        onclick="alert('Accounts section next')"
    >
        🏦<br>
        Accounts
    </button>

    <button
        onclick="alert('More options')"
    >
        ⋯<br>
        More
    </button>

</div>



<script>

/* =========================
   DATA
========================= */

let data =
JSON.parse(
    localStorage.getItem("moneyLedger")
) || {

    people: [],

    transactions: [],

    accounts: {

        "Bank of Baroda": 20000,

        "SBI": 15000,

        "Cash": 0

    }

};


let selectedPerson = null;

let transactionType = null;


/* =========================
   SAVE
========================= */

function saveData(){

    localStorage.setItem(
        "moneyLedger",
        JSON.stringify(data)
    );

}


/* =========================
   HOME
========================= */

function goHome(){

    document
        .getElementById("detail")
        .classList.remove("active");

    document
        .getElementById("home")
        .classList.add("active");

    showPeople();

}


/* =========================
   ADD PERSON
========================= */

function addPerson(){

    let name =
        prompt("Enter person's name");

    if(!name){

        return;

    }


    data.people.push({

        id:Date.now(),

        name:name,

        created:new Date().toLocaleDateString()

    });


    saveData();

    showPeople();

}


/* =========================
   PERSON BALANCE
========================= */

function getBalance(personId){

    let balance = 0;


    data.transactions.forEach(t=>{

        if(t.personId === personId){

            if(t.type === "gave"){

                balance += Number(t.amount);

            }

            else{

                balance -= Number(t.amount);

            }

        }

    });


    return balance;

}


/* =========================
   SHOW PEOPLE
========================= */

function showPeople(){

    let search =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    let html = "";


    data.people
    .filter(p =>
        p.name
        .toLowerCase()
        .includes(search)
    )
    .forEach(person=>{

        let balance =
            getBalance(person.id);


        let color =
            balance >= 0
            ? "green"
            : "red";


        html += `

        <div
            class="person"
            onclick="openPerson(${person.id})"
        >

            <div class="avatar">

                ${person.name
                    .substring(0,2)
                    .toUpperCase()}

            </div>


            <div class="person-info">

                <div class="person-name">

                    ${person.name}

                </div>

                <div class="time">

                    ${person.created}

                </div>

            </div>


            <div
                class="balance ${color}"
            >

                ₹${Math.abs(balance)
                    .toLocaleString("en-IN")}

            </div>

        </div>

        `;

    });


    document
        .getElementById("peopleList")
        .innerHTML =
        html ||

        `<p style="text-align:center;padding:40px;color:#777">
            No person added yet
        </p>`;

}


/* =========================
   OPEN PERSON
========================= */

function openPerson(id){

    selectedPerson = id;


    let person =
        data.people
        .find(p=>p.id === id);


    document
        .getElementById("detailName")
        .innerText =
        person.name;


    document
        .getElementById("home")
        .classList.remove("active");


    document
        .getElementById("detail")
        .classList.add("active");


    showTransactions();

}


/* =========================
   SHOW TRANSACTIONS
========================= */

function showTransactions(){

    let balance =
        getBalance(selectedPerson);


    document
        .getElementById("detailBalance")
        .innerText =
        "₹" +
        Math.abs(balance)
        .toLocaleString("en-IN");


    let html = "";


    let transactions =
        data.transactions
        .filter(t =>
            t.personId === selectedPerson
        )
        .reverse();


    transactions.forEach(t=>{

        html += `

        <div class="transaction">

            <div>

                <div class="transaction-date">

                    ${t.date}

                </div>

                <div class="note">

                    ${t.account}

                    <br>

                    ${t.note || ""}

                </div>

            </div>


            <div
                class="gave"
            >

                ${
                    t.type === "gave"
                    ? "₹" + Number(t.amount)
                        .toLocaleString("en-IN")
                    : ""
                }

            </div>


            <div
                class="got"
            >

                ${
                    t.type === "got"
                    ? "₹" + Number(t.amount)
                        .toLocaleString("en-IN")
                    : ""
                }

            </div>

        </div>

        `;

    });


    document
        .getElementById("transactions")
        .innerHTML =
        html ||

        `<div style="text-align:center;padding:50px;color:#777">

            No transactions yet.

        </div>`;

}


/* =========================
   TRANSACTION
========================= */

function transaction(type){

    transactionType = type;


    document
        .getElementById("modalTitle")
        .innerText =
        type === "gave"
        ? "YOU GAVE ₹"
        : "YOU GOT ₹";


    document
        .getElementById("amount")
        .value = "";


    document
        .getElementById("note")
        .value = "";


    document
        .getElementById("modal")
        .style.display =
        "flex";

}


/* =========================
   SAVE TRANSACTION
========================= */

function saveTransaction(){

    let amount =
        Number(
            document
            .getElementById("amount")
            .value
        );


    let account =
        document
        .getElementById("account")
        .value;


    let note =
        document
        .getElementById("note")
        .value;


    if(
        !amount ||
        amount <= 0
    ){

        alert(
            "Please enter valid amount"
        );

        return;

    }


    /*
       GAVE:
       Bank balance decreases

       GOT:
       Bank balance increases
    */


    if(transactionType === "gave"){

        if(
            data.accounts[account]
            < amount
        ){

            alert(
                "Insufficient balance in " +
                account
            );

            return;

        }


        data.accounts[account]
            -= amount;

    }

    else{

        data.accounts[account]
            += amount;

    }


    data.transactions.push({

        id:Date.now(),

        personId:selectedPerson,

        type:transactionType,

        amount:amount,

        account:account,

        note:note,

        date:new Date()
            .toLocaleString("en-IN")

    });


    saveData();

    closeModal();

    showTransactions();

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

    document
        .getElementById("modal")
        .style.display =
        "none";

}


/* FIRST LOAD */

showPeople();

</script>

</body>
</html>
