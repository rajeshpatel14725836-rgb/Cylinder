<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khata - Professional Ledger & FinTech Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --in-color: #10b981;
            --in-bg: #ecfdf5;
            --out-color: #ef4444;
            --out-bg: #fef2f2;
            --accent-blue: #2563eb;
            --expense-color: #d97706;
            --expense-bg: #fffbeb;
            --input-bg: #f8fafc;
            --bottom-nav-bg: #ffffff;
            --card-radius: 12px;
        }

        body.dark-mode {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --in-bg: rgba(16, 185, 129, 0.15);
            --out-bg: rgba(239, 68, 68, 0.15);
            --expense-bg: rgba(217, 119, 6, 0.15);
            --input-bg: #0f172a;
            --bottom-nav-bg: #1e293b;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 10px 10px 75px 10px; transition: background-color 0.3s, color 0.3s; }
        .container { max-width: 600px; margin: 0 auto; }

        /* Splash Screen */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .splash-title {
            font-size: 40px; font-weight: 900; color: #000000; letter-spacing: 3px;
            animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; transform: scale(0.6);
        }
        .splash-tagline {
            margin-top: 6px; font-size: 13px; font-weight: 700; color: #1e3a8a; letter-spacing: 1px;
            animation: fadeIn 0.7s ease 0.3s forwards; opacity: 0;
        }
        @keyframes popIn { to { opacity: 1; transform: scale(1); } }
        @keyframes fadeIn { to { opacity: 1; } }

        /* Top Bar & Toggles */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .brand-logo { font-size: 15px; font-weight: 800; color: #1e3a8a; display: flex; align-items: center; gap: 6px; }
        body.dark-mode .brand-logo { color: #60a5fa; }
        .top-controls { display: flex; gap: 6px; }
        .toggle-chip {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 5px 9px; border-radius: 16px; cursor: pointer; font-size: 11px; font-weight: 700;
            color: var(--text-main); box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .search-box-wrapper { margin-bottom: 10px; }
        .search-input {
            width: 100%; padding: 9px 12px; font-size: 12px; font-weight: 600;
            border: 1px solid var(--border-color); border-radius: 10px;
            background: var(--card-bg); color: var(--text-main); outline: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        /* Banner Dashboard */
        .dashboard-banner {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: var(--card-radius); padding: 12px; margin-bottom: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.02);
        }
        .main-balance-box {
            text-align: center; padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color); margin-bottom: 8px;
        }
        .main-balance-box span { font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .main-balance-box h2 { font-size: 24px; font-weight: 800; color: var(--accent-blue); margin-top: 2px; }

        .visual-bar-container {
            height: 5px; width: 100%; background: var(--input-bg); border-radius: 3px;
            overflow: hidden; display: flex; margin-bottom: 8px; border: 1px solid var(--border-color);
        }
        .bar-get { background: var(--in-color); transition: width 0.3s; }
        .bar-give { background: var(--out-color); transition: width 0.3s; }

        .sub-analytics { display: flex; justify-content: space-around; text-align: center; }
        .sub-box { flex: 1; }
        .sub-box span { font-size: 9px; font-weight: 700; color: var(--text-muted); }
        .sub-box h4 { font-size: 11px; font-weight: 800; margin-top: 2px; }

        .view-panel { display: none; }
        .view-panel.active { display: block; }

        /* Universal Add Container */
        .universal-add-container { margin-bottom: 12px; }
        .universal-add-btn {
            width: 100%; padding: 10px; background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); 
            color: white; font-size: 12px; font-weight: 800; border-radius: 10px; cursor: pointer;
            text-align: center; border: none; box-shadow: 0 3px 10px rgba(37,99,235,0.2); transition: all 0.2s;
        }
        .universal-add-btn:active { transform: scale(0.98); }

        /* Minimal & Sleek Cards Styling */
        .card {
            background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px 12px;
            border-radius: var(--card-radius); margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            position: relative; overflow: hidden;
        }
        
        .card.strip-in { border-left: 4px solid var(--in-color); }
        .card.strip-out { border-left: 4px solid var(--out-color); }
        .card.strip-expense { border-left: 4px solid var(--expense-color); }
        .card.strip-neutral { border-left: 4px solid var(--accent-blue); }

        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 13px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
        .card-balance { font-size: 13px; font-weight: 800; text-align: right; }

        .pill-indicator {
            display: inline-block; padding: 1px 5px; border-radius: 6px; font-size: 8px; font-weight: 700; margin-top: 1px;
        }
        .pill-get { background: var(--in-bg); color: var(--in-color); }
        .pill-give { background: var(--out-bg); color: var(--out-color); }
        .pill-expense { background: var(--expense-bg); color: var(--expense-color); }

        .bank-mini-stats {
            display: flex; gap: 6px; margin-top: 6px; font-size: 9px; color: var(--text-muted); font-weight: 700;
            background: var(--input-bg); padding: 5px 8px; border-radius: 6px;
        }

        /* Quick Action Buttons */
        .quick-actions { display: flex; gap: 6px; margin-top: 8px; }
        .btn-quick-in { background: var(--in-color); color: white; border: none; padding: 6px 8px; font-size: 10px; font-weight: 700; border-radius: 6px; flex: 1; cursor: pointer; }
        .btn-quick-out { background: var(--out-color); color: white; border: none; padding: 6px 8px; font-size: 10px; font-weight: 700; border-radius: 6px; flex: 1; cursor: pointer; }

        .toggle-btn {
            background: var(--input-bg); color: var(--accent-blue); border: 1px solid var(--border-color);
            padding: 5px 8px; font-size: 9px; font-weight: 700; border-radius: 6px; cursor: pointer;
            margin-top: 6px; width: 100%; text-align: center;
        }
        .card-body { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color); }
        .card-body.open { display: block; }

        .form-group { margin-bottom: 8px; }
        label { display: block; font-size: 9px; margin-bottom: 2px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        input, select {
            width: 100%; padding: 9px 11px; font-size: 12px; border: 1px solid var(--border-color);
            border-radius: 8px; outline: none; background-color: var(--input-bg); color: var(--text-main); font-weight: 600;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 9000; padding: 12px;
        }
        .modal-card {
            background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 16px;
            padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; border: 1px solid var(--border-color);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .modal-title { font-size: 14px; font-weight: 800; color: var(--text-main); }
        .close-modal { font-size: 16px; font-weight: 800; border: none; background: none; color: var(--text-muted); cursor: pointer; }

        /* Date Quick Chips */
        .date-chips { display: flex; gap: 4px; margin-top: 4px; }
        .chip {
            padding: 3px 8px; font-size: 9px; font-weight: 700; border-radius: 5px;
            background: var(--input-bg); border: 1px solid var(--border-color); cursor: pointer; color: var(--text-muted);
        }
        .chip.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }

        /* Quick Filter Pills */
        .pill-filters { display: flex; gap: 4px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; }
        .filter-pill {
            background: var(--input-bg); border: 1px solid var(--border-color); padding: 4px 8px; font-size: 9px;
            font-weight: 700; border-radius: 12px; cursor: pointer; color: var(--text-muted); white-space: nowrap;
        }
        .filter-pill.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }

        /* Buttons */
        button { padding: 9px 11px; font-size: 11px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn-in { background: var(--in-color); color: white; flex: 1; }
        .btn-out { background: var(--out-color); color: white; flex: 1; }
        .btn-primary { background: #1e3a8a; color: white; width: 100%; padding: 10px; font-size: 12px; }
        body.dark-mode .btn-primary { background: var(--accent-blue); }
        .btn-export { background: #0284c7; color: white; padding: 3px 6px; font-size: 8px; border-radius: 5px; }

        .action-btns { display: flex; gap: 4px; align-items: center; }
        .btn-sm { padding: 2px 5px; font-size: 8px; border-radius: 4px; }
        .btn-edit { background: #f59e0b; color: white; }
        .btn-del { background: #ef4444; color: white; }

        /* History Table */
        .table-wrapper { overflow-x: auto; margin-top: 6px; border-radius: 6px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; font-size: 9px; text-align: left; }
        th { background: var(--input-bg); color: var(--text-muted); font-weight: 700; padding: 6px; border-bottom: 1px solid var(--border-color); }
        td { padding: 6px; border-bottom: 1px solid var(--border-color); color: var(--text-main); font-weight: 600; }
        .badge-in { background: var(--in-bg); color: var(--in-color); padding: 1px 4px; border-radius: 6px; font-weight: 700; }
        .badge-out { background: var(--out-bg); color: var(--out-color); padding: 1px 4px; border-radius: 6px; font-weight: 700; }
        .empty-msg { font-size: 10px; color: var(--text-muted); text-align: center; padding: 8px 0; font-weight: 600; }

        /* Fixed Bottom Navigation Bar */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bottom-nav-bg);
            border-top: 1px solid var(--border-color); display: flex; justify-content: space-around;
            align-items: center; padding: 5px 0; z-index: 1000; box-shadow: 0 -3px 12px rgba(0,0,0,0.04);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; font-size: 9px; font-weight: 700;
            color: var(--text-muted); text-decoration: none; cursor: pointer; flex: 1; border: none; background: none;
        }
        .nav-item.active { color: var(--accent-blue); }
        .nav-icon { font-size: 15px; margin-bottom: 1px; }

        /* Footer */
        .app-footer { text-align: center; margin-top: 16px; padding-bottom: 8px; font-size: 10px; font-weight: 700; color: var(--text-muted); }
        .app-footer span { color: var(--accent-blue); }

        /* A4 Printable Layout */
        @media print {
            @page { size: A4; margin: 15mm; }
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area {
                position: absolute; left: 0; top: 0; width: 100%;
                color: #000 !important; background: #fff !important; padding: 0 !important;
            }
            .bottom-nav, .btn-sm, .action-btns, .top-controls, .universal-add-container, .toggle-btn, .quick-actions, .pill-filters, .modal-overlay, .search-box-wrapper { display: none !important; }
            .pdf-watermark-header { display: block !important; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #1e3a8a; padding-bottom: 10px; }
            .table-wrapper { border: 1px solid #000 !important; }
            th, td { border-bottom: 1px solid #000 !important; color: #000 !important; }
        }
        .pdf-watermark-header { display: none; }
    </style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash-screen">
    <div class="splash-title">KHATA</div>
    <div class="splash-tagline">Concept by Rajesh</div>
</div>

<div class="container">
    <div class="top-bar">
        <span class="brand-logo">📖 KHATA</span>
        <div class="top-controls">
            <button class="toggle-chip" id="langToggleBtn" onclick="toggleLanguage()">🌐 हिंदी</button>
            <button class="toggle-chip" onclick="toggleDarkMode()">🌙 / ☀️</button>
        </div>
    </div>

    <!-- Instant Search Bar -->
    <div class="search-box-wrapper">
        <input type="text" id="globalSearch" class="search-input" placeholder="🔎 Search Account, Customer or Expense..." onfocus="onSearchFocus()" onblur="onSearchBlur()" onkeyup="filterCards()">
    </div>

    <!-- Summary Dashboard -->
    <div class="dashboard-banner">
        <div class="main-balance-box">
            <span id="lblTotalBal">Total Available Balance</span>
            <h2 id="dashTotalBalance">₹0</h2>
        </div>
        
        <div class="visual-bar-container">
            <div id="barGet" class="bar-get" style="width: 50%;"></div>
            <div id="barGive" class="bar-give" style="width: 50%;"></div>
        </div>

        <div class="sub-analytics">
            <div class="sub-box">
                <span id="lblGet">You Will Get (लेना)</span>
                <h4 id="dashTotalGet" style="color: var(--in-color);">₹0</h4>
            </div>
            <div class="sub-box" style="border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); padding: 0 4px;">
                <span id="lblGive">You Will Give (देना)</span>
                <h4 id="dashTotalGive" style="color: var(--out-color);">₹0</h4>
            </div>
            <div class="sub-box">
                <span id="lblExp">Total Expense (खर्चा)</span>
                <h4 id="dashTotalExpense" style="color: var(--expense-color);">₹0</h4>
            </div>
        </div>
    </div>

    <!-- Universal Action Hub -->
    <div class="universal-add-container" id="universalAddCont">
        <button class="universal-add-btn" onclick="openUniversalCreateModal()">➕ <span id="lblCreateBtn">+ Create Head</span></button>
    </div>

    <!-- ================= ACCOUNTS VIEW (Banks) ================= -->
    <div id="accountsView" class="view-panel active">
        <h3 id="lblBankHeader" style="font-size: 11px; margin-bottom: 6px; color: var(--text-muted); font-weight: 800;">BANK & CASH ACCOUNTS</h3>
        <div id="banksList"></div>
    </div>

    <!-- ================= PARTIES & EXPENSES VIEW ================= -->
    <div id="personsView" class="view-panel">
        <h3 id="lblClientHeader" style="font-size: 11px; margin-bottom: 6px; color: var(--text-muted); font-weight: 800;">CUSTOMERS, SUPPLIERS & EXPENSES</h3>
        <div id="personsList"></div>
    </div>

    <!-- Footer Credit -->
    <div class="app-footer">
        Concept by <span>Rajesh</span>
    </div>
</div>

<!-- Modal Popup -->
<div id="entryModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <span class="modal-title" id="modalTitle">Action</span>
            <button class="close-modal" onclick="closeModal()">✕</button>
        </div>
        <div id="modalFormContent"></div>
    </div>
</div>

<!-- Mobile Bottom Navigation Bar -->
<div class="bottom-nav">
    <button class="nav-item active" id="nav_accounts" onclick="switchTab('accounts')">
        <span class="nav-icon">🏦</span>
        <span id="navLblAcc">Accounts</span>
    </button>
    <button class="nav-item" id="nav_persons" onclick="switchTab('persons')">
        <span class="nav-icon">👥</span>
        <span id="navLblParties">Parties & Exp</span>
    </button>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }
        }, 1400);
    });

    let state = JSON.parse(localStorage.getItem('ledgerAppV23')) || {
        banks: [],
        persons: [],
        transactions: [],
        darkMode: false,
        lang: 'EN'
    };

    if (state.darkMode) document.body.classList.add('dark-mode');

    function toggleDarkMode() {
        state.darkMode = !state.darkMode;
        document.body.classList.toggle('dark-mode');
        saveData();
    }

    function toggleLanguage() {
        state.lang = state.lang === 'EN' ? 'HI' : 'EN';
        saveData();
    }

    function saveData() {
        localStorage.setItem('ledgerAppV23', JSON.stringify(state));
        render();
        updateLanguageLabels();
    }

    function updateLanguageLabels() {
        const isHi = state.lang === 'HI';
        document.getElementById('langToggleBtn').innerText = isHi ? '🌐 English' : '🌐 हिंदी';
        document.getElementById('lblTotalBal').innerText = isHi ? 'कुल उपलब्ध बैलेंस' : 'Total Available Balance';
        document.getElementById('lblGet').innerText = isHi ? 'लेना है (Get)' : 'You Will Get (Get)';
        document.getElementById('lblGive').innerText = isHi ? 'देना है (Give)' : 'You Will Give (Give)';
        document.getElementById('lblExp').innerText = isHi ? 'कुल खर्चा (Expense)' : 'Total Expense (Expense)';
        document.getElementById('lblCreateBtn').innerText = isHi ? '+ Create Head' : '+ Create Head';
        document.getElementById('lblBankHeader').innerText = isHi ? 'बैंक और कैश खाते' : 'BANK & CASH ACCOUNTS';
        document.getElementById('lblClientHeader').innerText = isHi ? 'कस्टमर, सप्लायर और खर्चे' : 'CUSTOMERS, SUPPLIERS & EXPENSES';
        document.getElementById('navLblAcc').innerText = isHi ? 'खाते' : 'Accounts';
        document.getElementById('navLblParties').innerText = isHi ? 'पार्टी और खर्चे' : 'Parties & Exp';
        document.getElementById('globalSearch').placeholder = isHi ? '🔎 बैंक, कस्टमर या खर्चा खोजें...' : '🔎 Search Account, Customer or Expense...';
    }

    function switchTab(tab) {
        document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
        
        if(tab === 'accounts') {
            document.getElementById('nav_accounts').classList.add('active');
            document.getElementById('accountsView').classList.add('active');
        } else {
            document.getElementById('nav_persons').classList.add('active');
            document.getElementById('personsView').classList.add('active');
        }
    }

    function openModal(title, htmlContent) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalFormContent').innerHTML = htmlContent;
        document.getElementById('entryModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('entryModal').style.display = 'none';
    }

    function onSearchFocus() {
        const cont = document.getElementById('universalAddCont');
        if(cont) cont.style.display = 'none';
    }

    function onSearchBlur() {
        const query = document.getElementById('globalSearch').value.trim();
        if(!query) {
            const cont = document.getElementById('universalAddCont');
            if(cont) cont.style.display = 'block';
        }
    }

    function filterCards() {
        const query = document.getElementById('globalSearch').value.toLowerCase();
        document.querySelectorAll('.card').forEach(card => {
            const title = card.querySelector('.card-title').innerText.toLowerCase();
            if(title.includes(query)) card.style.display = '';
            else card.style.display = 'none';
        });
    }

    // --- UNIVERSAL CREATE MODAL ---
    function openUniversalCreateModal() {
        const isHi = state.lang === 'HI';
        const html = `
            <div class="form-group">
                <label>${isHi ? 'हेड या खाता नाम (Name)' : 'Account / Head Name'}</label>
                <input type="text" id="uniName" placeholder="${isHi ? 'जैसे: SBI, Rahul, Petrol...' : 'e.g., SBI, Rahul, Petrol...'}" autofocus>
            </div>
            <div class="form-group">
                <label>${isHi ? 'अकाउंट टाइप चुनें (Account Type)' : 'Select Account Type'}</label>
                <select id="uniType" onchange="onUniTypeChangeModel()">
                    <option value="BANK">🏦 ${isHi ? 'बैंक खाता (Bank Account)' : 'Bank Account'}</option>
                    <option value="CASH">💵 ${isHi ? 'कैश इन हैंड (Cash in Hand)' : 'Cash in Hand'}</option>
                    <option value="CUSTOMER">🤝 ${isHi ? 'कस्टमर (Customer - To Get)' : 'Customer (To Get)'}</option>
                    <option value="SUPPLIER">👥 ${isHi ? 'सप्लायर (Supplier - To Give)' : 'Supplier (To Give)'}</option>
                    <option value="EXPENSE">🛒 ${isHi ? 'खर्चा हेड (Expense Head)' : 'Expense Head'}</option>
                </select>
            </div>
            <div class="form-group" id="uniOpBalWrapper">
                <label id="uniOpBalLabel">${isHi ? 'ओपनिंग बैलेंस (₹)' : 'Opening Balance (₹)'}</label>
                <input type="number" id="uniOpBal" value="0">
            </div>
            <button class="btn-primary" style="margin-top:6px;" onclick="submitUniversalCreate()">${isHi ? 'सुरक्षित करें (Save)' : 'Save Head'}</button>
        `;
        openModal(isHi ? '+ Create Head' : '+ Create Head', html);
    }

    function onUniTypeChangeModel() {
        const type = document.getElementById('uniType').value;
        const label = document.getElementById('uniOpBalLabel');

    function editBank(bankId) {
        const bank = state.banks.find(b => b.id === bankId);
        if(!bank) return;
        const newName = prompt("Update Name:", bank.name);
        if(newName === null) return;
        const newOpBal = prompt("Update Opening Balance (₹):", bank.openingBalance || bank.balance);
        if(newOpBal === null || isNaN(parseFloat(newOpBal))) return;

        bank.name = newName.trim() || bank.name;
        bank.openingBalance = parseFloat(newOpBal);
        
        recalculateBankBalance(bank.id);
        state.transactions.forEach(t => { if(t.bankId === bankId) t.bankName = bank.name; });
        saveData();
    }

    function recalculateBankBalance(bankId) {
        const bank = state.banks.find(b => b.id === bankId);
        if(!bank) return;
        let bal = bank.openingBalance || 0;
        state.transactions.forEach(t => {
            if(t.bankId === bankId) {
                if(t.type === 'IN') bal += t.amount;
                if(t.type === 'OUT') bal -= t.amount;
            }
        });
        bank.balance = bal;
    }

    function deleteBank(bankId) {
        if(!confirm("Delete this account?")) return;
        state.banks = state.banks.filter(b => b.id !== bankId);
        state.transactions = state.transactions.filter(t => t.bankId !== bankId);
        saveData();
    }

    function editPerson(personId) {
        const person = state.persons.find(p => p.id === personId);
        if(!person) return;
        const newName = prompt("Update Name:", person.name);
        if(!newName || !newName.trim()) return;
        const newOpBal = prompt("Update Opening Balance (₹):", person.openingBalance || 0);
        if(newOpBal === null || isNaN(parseFloat(newOpBal))) return;

        person.name = newName.trim();
        person.openingBalance = parseFloat(newOpBal);
        state.transactions.forEach(t => { if(t.personId === personId) t.personName = person.name; });
        saveData();
    }

    function deletePerson(personId) {
        if(!confirm("Delete this Head?")) return;
        state.persons = state.persons.filter(p => p.id !== personId);
        state.transactions = state.transactions.filter(t => t.personId !== personId);
        saveData();
    }

    function setQuickDate(targetInputId, type, btnElement) {
        const parent = btnElement.parentElement;
        parent.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        btnElement.classList.add('active');

        const inputElem = document.getElementById(targetInputId);
        const today = new Date();

        if(type === 'TODAY') {
            inputElem.value = today.toISOString().split('T')[0];
        } else if(type === 'YESTERDAY') {
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            inputElem.value = yesterday.toISOString().split('T')[0];
        }
    }

    function submitModalTrans(entityId, entityType, actionType) {
        const amount = parseFloat(document.getElementById('modal_amount').value);
        const desc = document.getElementById('modal_desc').value.trim() || 'No description';
        const customDate = document.getElementById('modal_date').value;

        let bankId = "", personId = "";
        if(entityType === 'BANK') {
            bankId = entityId;
            personId = document.getElementById('modal_select_person').value;
        } else {
            personId = entityId;
            bankId = document.getElementById('modal_select_bank').value;
        }

        if(!amount || amount <= 0) return alert('Please enter valid amount');
        if(!bankId || !personId) return alert('Please select required account/head');

        const bank = state.banks.find(b => b.id === bankId);
        const person = state.persons.find(p => p.id === personId);

        let formattedDate = new Date().toLocaleDateString('en-IN');
        if(customDate) {
            formattedDate = new Date(customDate).toLocaleDateString('en-IN');
        }

        state.transactions.unshift({
            id: 't_' + Date.now(),
            bankId: bank.id,
            bankName: bank.name,
            personId: person.id,
            personName: person.name,
            type: actionType,
            amount,
            description: desc,
            date: formattedDate
        });

        recalculateBankBalance(bank.id);
        closeModal();
        saveData();
    }

    function editTransaction(transId) {
        const t = state.transactions.find(trans => trans.id === transId);
        if(!t) return;

        const newAmountStr = prompt("Edit Amount (₹):", t.amount);
        if(newAmountStr === null || isNaN(parseFloat(newAmountStr))) return;
        const newAmount = parseFloat(newAmountStr);

        const newDesc = prompt("Edit Description:", t.description);
        if(newDesc === null) return;

        t.amount = newAmount;
        t.description = newDesc.trim() || 'No description';

        recalculateBankBalance(t.bankId);
        saveData();
    }

    function deleteTransaction(transId) {
        if(!confirm("Delete transaction?")) return;
        const transIndex = state.transactions.findIndex(t => t.id === transId);
        if(transIndex === -1) return;

        const bankId = state.transactions[transIndex].bankId;
        state.transactions.splice(transIndex, 1);
        
        recalculateBankBalance(bankId);
        saveData();
    }

    function exportToCSV(entityName, transactions) {
        if(!transactions || transactions.length === 0) return alert('No transactions!');
        let csvContent = "\uFEFFDate,Details,Type,Amount (INR),Note\n";
        transactions.forEach(t => {
            csvContent += `"${t.date}","${t.personName} / ${t.bankName}","${t.type}","${t.amount}","${t.description}"\n`;
        });
        
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `${entityName.replace(/\s+/g, '_')}_Statement.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function exportToPDF(containerId) {
        const targetElement = document.getElementById(containerId);
        if (!targetElement) return alert('No data!');

        document.querySelectorAll('.print-area').forEach(el => el.classList.remove('print-area'));
        targetElement.classList.add('print-area');
        window.print();
    }

    function setFilterPill(filterType, containerId, event) {
        const pills = document.querySelectorAll(`#pills_${containerId} .filter-pill`);
        pills.forEach(p => p.classList.remove('active'));
        if(event) event.target.classList.add('active');

        const rows = document.querySelectorAll(`#${containerId} tbody tr`);
        const todayStr = new Date().toLocaleDateString('en-IN');

        rows.forEach(row => {
            const type = row.getAttribute('data-type');
            const dateStr = row.getAttribute('data-date');

            let show = false;
            if(filterType === 'ALL') show = true;
            else if(filterType === 'IN' && type === 'IN') show = true;
            else if(filterType === 'OUT' && type === 'OUT') show = true;
            else if(filterType === 'TODAY' && dateStr === todayStr) show = true;

            row.style.display = show ? '' : 'none';
        });
    }

    function getTodayInputFormat() {
        return new Date().toISOString().split('T')[0];
    }

    function toggleCardBody(id) {
        const bodyElem = document.getElementById(id);
        const btnElem = document.getElementById('btn_' + id);
        if (bodyElem.classList.contains('open')) {
            bodyElem.classList.remove('open');
            btnElem.innerText = state.lang === 'HI' ? '🔽 इतिहास देखें' : '🔽 Open History';
        } else {
            bodyElem.classList.add('open');
            btnElem.innerText = state.lang === 'HI' ? '🔼 छिपाएँ' : '🔼 Hide';
        }
    }

    function render() {
        updateLanguageLabels();

        let totalNet = 0;
        state.banks.forEach(b => {
            recalculateBankBalance(b.id);
            totalNet += b.balance;
        });

        let totalGet = 0, totalGive = 0, totalExpense = 0;
        state.persons.forEach(person => {
            const personTrans = state.transactions.filter(t => t.personId === person.id);
            let pBal = person.openingBalance || 0; // Include direct opening balance without affecting banks

            personTrans.forEach(t => {
                if (person.type === 'SUPPLIER') {
                    if(t.type === 'IN') pBal += t.amount;
                    if(t.type === 'OUT') pBal -= t.amount;
                } else {
                    if(t.type === 'OUT') pBal += t.amount;
                    if(t.type === 'IN') pBal -= t.amount;
                }
            });

            if (person.type === 'EXPENSE') {
                let expSum = person.openingBalance || 0;
                personTrans.forEach(t => {
                    if(t.type === 'OUT') expSum += t.amount;
                    if(t.type === 'IN') expSum -= t.amount;
                });
                if(expSum > 0) totalExpense += expSum;
            } else if (person.type === 'SUPPLIER') {
                if(pBal > 0) totalGive += pBal;
                if(pBal < 0) totalGet += Math.abs(pBal);
            } else {
                if(pBal > 0) totalGet += pBal;
                if(pBal < 0) totalGive += Math.abs(pBal);
            }
        });

        document.getElementById('dashTotalBalance').innerText = '₹' + totalNet.toLocaleString('en-IN');
        document.getElementById('dashTotalGet').innerText = '₹' + totalGet.toLocaleString('en-IN');
        document.getElementById('dashTotalGive').innerText = '₹' + totalGive.toLocaleString('en-IN');
        document.getElementById('dashTotalExpense').innerText = '₹' + totalExpense.toLocaleString('en-IN');

        const totalSum = totalGet + totalGive;
        if(totalSum > 0) {
            document.getElementById('barGet').style.width = ((totalGet / totalSum) * 100) + '%';
            document.getElementById('barGive').style.width = ((totalGive / totalSum) * 100) + '%';
        } else {
            document.getElementById('barGet').style.width = '50%';

                    <div class="card-body" id="body_person_${person.id}">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                            <span style="font-size:9px; font-weight:800; color:var(--text-muted);">STATEMENT</span>
                            <div>
                                <button class="btn-export" onclick="exportToCSV('${person.name}', state.transactions.filter(t => t.personId === '${person.id}'))">Excel</button>
                                <button class="btn-export" onclick="exportToPDF('card_person_${person.id}')">PDF</button>
                            </div>
                        </div>

                        ${renderHistoryTable(personTrans, 'bankName', `table_person_${person.id}`)}
                    </div>
                `;
                personsList.appendChild(card);
            });
        }
    }

    function renderHistoryTable(transactions, relatedField, containerId) {
        if(transactions.length === 0) return '<p class="empty-msg">No transactions recorded.</p>';
        const isHi = state.lang === 'HI';
        
        let rows = transactions.map(t => `
            <tr data-type="${t.type}" data-date="${t.date}">
                <td>
                    <strong>${t[relatedField]}</strong><br>
                    <span style="font-size: 8px; color: var(--text-muted);">${t.description}</span>
                </td>
                <td><span class="${t.type === 'IN' ? 'badge-in' : 'badge-out'}">${t.type}</span></td>
                <td><strong>₹${t.amount.toLocaleString('en-IN')}</strong></td>
                <td style="color:var(--text-muted);">${t.date}</td>
                <td style="text-align:center;">
                    <button class="btn-sm btn-edit" onclick="editTransaction('${t.id}')">✏️</button>
                    <button class="btn-sm btn-del" onclick="deleteTransaction('${t.id}')">✕</button>
                </td>
            </tr>
        `).join('');

        return `
            <div class="pill-filters" id="pills_${containerId}">
                <button class="filter-pill active" onclick="setFilterPill('ALL', '${containerId}', event)">${isHi ? 'सभी' : 'All'}</button>
                <button class="filter-pill" onclick="setFilterPill('TODAY', '${containerId}', event)">${isHi ? 'आज' : 'Today'}</button>
                <button class="filter-pill" onclick="setFilterPill('IN', '${containerId}', event)">IN</button>
                <button class="filter-pill" onclick="setFilterPill('OUT', '${containerId}', event)">OUT</button>
            </div>
            <div class="table-wrapper" id="${containerId}">
                <table>
                    <thead>
                        <tr><th>${isHi ? 'विवरण' : 'Details'}</th><th>Type</th><th>${isHi ? 'राशि' : 'Amount'}</th><th>${isHi ? 'दिनांक' : 'Date'}</th><th>Action</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
        `;
    }

    render();
</script>

</body>
</html>
